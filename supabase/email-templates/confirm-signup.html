<!-- Paste into Supabase: Authentication -> Email Templates -> Confirm signup. Subject: Confirm your NFS account -->
<div style="background:#050A1A;padding:32px 16px;font-family:Inter,Segoe UI,Arial,sans-serif;color:#E2E8F0">
  <div style="max-width:520px;margin:0 auto;background:#0C1838;border:1px solid #1B2D63;border-radius:16px;padding:32px">
    <p style="margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:3px;color:#fff">NFS</p>
    <p style="margin:0 0 24px;font-size:11px;letter-spacing:2px;color:#94A3B8">NEURAL FORECASTING SYSTEM</p>

    <p style="margin:0 0 24px;line-height:1.6;color:#CBD5E1">Welcome to NFS. Confirm your email address to activate your account.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3B82F6;color:#fff;text-decoration:none;padding:12px 22px;border-radius:10px;font-weight:600">Confirm email</a>
    <p style="margin:24px 0 0;font-size:12px;color:#94A3B8">If you did not create an NFS account you can ignore this message.</p>
